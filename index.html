<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LabVIEW 28–32｜智慧量測應用：資料擷取、聲音分析與機器視覺</title><style>
:root{color-scheme:dark;--bg:#0b1425;--panel:#15243b;--line:#314258;--fg:#eef5ff;--secondary:#9bb0ca;--accent:#7bb7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px max(15px,calc((100vw - 1600px)/2));background:#101e31;border-bottom:1px solid var(--line)}h1{font-size:17px;line-height:1.35;margin:0}header small{color:var(--secondary)}button{border:1px solid #536c8b;border-radius:9px;background:#233958;color:white;padding:9px 14px;font:inherit;cursor:pointer}button:hover{background:#32547b}button:focus-visible{outline:3px solid var(--accent)}button:disabled{opacity:.35;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap}.layout{max-width:1650px;margin:auto;padding:15px}.frame{width:100%;aspect-ratio:16/9;background:#f4f4f4;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 10px 35px #0005;border-radius:4px}.frame img{width:100%;height:100%;object-fit:contain}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:12px 0;flex-wrap:wrap}.left,.right{display:flex;align-items:center;gap:8px}#counter{min-width:82px;text-align:center;font-variant-numeric:tabular-nums}#notes{margin:20px 0 32px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:22px;white-space:pre-wrap;line-height:1.95;font-size:17px}#notes h2{font-size:20px;margin:0 0 12px}#notes p{margin:0}#overview{display:none;padding:15px 0 35px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:15px}#overview.open{display:grid}.thumb{border:1px solid var(--line);padding:7px;background:#17273d;text-align:left;border-radius:8px}.thumb.active{border:2px solid var(--accent)}.thumb img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.thumb span{display:block;font-size:13px;margin-top:5px;color:#deebff}footer{max-width:1650px;margin:auto;padding:0 16px 20px;color:var(--secondary);font-size:13px}@media(max-width:600px){header{display:block}header .actions{margin-top:8px}h1{font-size:15px}.layout{padding:7px}button{padding:8px 10px;font-size:14px}#notes{font-size:16px;padding:16px}}:fullscreen .layout{max-width:none}#presentation:fullscreen{background:#080b12;display:flex;align-items:center;justify-content:center}#presentation:fullscreen img{object-fit:contain}
</style></head><body><header><div><h1>LabVIEW 28–32｜智慧量測應用：資料擷取、聲音分析與機器視覺</h1><small>16:9 網路教材・逐頁教師講稿</small></div><div class="actions"><button id="notesBtn" aria-expanded="false">顯示講稿</button><button id="overviewBtn" aria-expanded="false">頁面總覽</button><button id="fullscreenBtn">全螢幕</button></div></header><main class="layout"><div class="frame" id="presentation"><img id="slideImg" src="slides/slide-001.jpg" alt="第1頁投影片"></div><nav class="toolbar"><div class="left"><button id="prevBtn">← 上一頁</button><span id="counter">1 / 116</span><button id="nextBtn">下一頁 →</button></div><div class="right"><label for="pageInput">跳至</label><input id="pageInput" type="number" min="1" max="116" value="1" style="width:62px;padding:8px;color:#fff;background:#1b2b44;border:1px solid #526b88;border-radius:7px"></div></nav><section id="notes" hidden aria-label="教師講稿"><h2>教師講稿｜第 <span id="notesPage">1</span> 頁</h2><p id="noteText"></p></section><div id="overview" aria-label="投影片總覽"></div></main><footer>鍵盤 ← → 翻頁，Home / End 前往首末頁。圖片和講稿均包含在網站資料夾內，可部署至 GitHub Pages。</footer><script src="data.js"></script><script>
(()=>{'use strict';const slides=window.LECTURE_DATA||[];let index=0,notesVisible=false,overviewVisible=false;const $=id=>document.getElementById(id);const img=$('slideImg'),notes=$('notes'),overview=$('overview');if(!slides.length){$('counter').textContent='資料載入失敗';return}function render(){let s=slides[index];img.src=s.image;img.alt='第'+s.number+'頁：'+s.title;$('counter').textContent=s.number+' / '+slides.length;$('pageInput').value=s.number;$('notesPage').textContent=s.number;$('noteText').textContent=s.notes||'本頁未填寫教師講稿。';$('prevBtn').disabled=index===0;$('nextBtn').disabled=index===slides.length-1;document.querySelectorAll('.thumb').forEach((b,i)=>{b.classList.toggle('active',i===index);b.setAttribute('aria-current',i===index?'page':'false')});location.hash='slide-'+s.number}function go(i){index=Math.min(Math.max(i,0),slides.length-1);render()}$('prevBtn').onclick=()=>go(index-1);$('nextBtn').onclick=()=>go(index+1);$('pageInput').onchange=e=>go((parseInt(e.target.value,10)||1)-1);$('notesBtn').onclick=()=>{notesVisible=!notesVisible;notes.hidden=!notesVisible;$('notesBtn').textContent=notesVisible?'隱藏講稿':'顯示講稿';$('notesBtn').setAttribute('aria-expanded',notesVisible)};$('overviewBtn').onclick=()=>{overviewVisible=!overviewVisible;overview.classList.toggle('open',overviewVisible);$('overviewBtn').textContent=overviewVisible?'關閉總覽':'頁面總覽';$('overviewBtn').setAttribute('aria-expanded',overviewVisible);if(overviewVisible)overview.scrollIntoView({behavior:'smooth',block:'start'})};$('fullscreenBtn').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else $('presentation').requestFullscreen?.()};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(index-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1)});slides.forEach((s,i)=>{const b=document.createElement('button');b.className='thumb';b.innerHTML='<img loading="lazy" src="'+s.image+'" alt=""><span>第 '+s.number+' 頁｜'+s.title.replaceAll('&','&amp;').replaceAll('<','&lt;')+'</span>';b.onclick=()=>{go(i);window.scrollTo({top:0,behavior:'smooth'})};overview.appendChild(b)});const m=location.hash.match(/slide-(\d+)/);if(m)index=Math.min(Math.max(parseInt(m[1],10)-1,0),slides.length-1);render()})();
</script></body></html>
